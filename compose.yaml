services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kidan
      POSTGRES_USER: kidan_dev
      POSTGRES_PASSWORD: kidan_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidan_dev -d kidan"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - kidan_postgres_data:/var/lib/postgresql/data

volumes:
  kidan_postgres_data:
