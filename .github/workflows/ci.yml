name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type checks
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Builds
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Diff hygiene
        run: git diff --check

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kidan
          POSTGRES_USER: kidan_dev
          POSTGRES_PASSWORD: kidan_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidan_dev -d kidan"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kidan_dev:kidan_dev_only@127.0.0.1:5432/kidan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type checks (integration sources)
        run: npm run typecheck
      - name: PostgreSQL integration tests (disposable databases)
        run: npm run db:test
